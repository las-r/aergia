title: Aergia Docs
description: Documentation for the Aergia programming language.
#theme: just-the-docs
search_enabled: true
color_scheme: dark

logo: "https://raw.githubusercontent.com/las-r/aergia/main/assets/images/docs.svg"

plugins:
  - jekyll-remote-theme
remote_theme: just-the-docs/just-the-docs

url: https://las-r.github.io/aergia

gh_edit_repository: "https://github.com/las-r/aergia"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

aux_links:
  "GitHub": "https://github.com/las-r/aergia"

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: :compressed
  quiet_deps: true