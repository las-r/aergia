[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aergia-lang"
version = "1.15.4"
description = "The Aergia programming language"
authors = [{ name = "las-r" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "interpreter", 
    "programming-language", 
    "esoteric-language", 
    "esolang", 
    "aergia", 
    "aergia-lang",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://las-r.github.io/aergia/"
Documentation = "https://las-r.github.io/aergia/"
Repository = "https://github.com/las-r/aergia"
Issues = "https://github.com/las-r/aergia/issues"

[project.scripts]
aergia = "aergia.__main__:main"

[tool.setuptools.packages.find]
include = ["aergia*"]